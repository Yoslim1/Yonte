name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce feature isolation
        run: python3 tools/check_architecture.py

      - name: Enforce changelog updates
        run: python3 tools/check_changelog.py

      - name: Check Kotlin and compile debug APK
        run: ./gradlew :core:update:test :core:database:test :core:security:test :core:backup:test :feature:notes:test :feature:onboarding:test :feature:settings:test :app:assembleDebug --stacktrace

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented database security tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :core:database:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-connected-test-report
          path: |
            core/database/build/reports/androidTests/
            core/database/build/test-results/
          if-no-files-found: warn

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yonte-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    # Enable after adding signing secrets and repository variable YONTE_SIGNED_RELEASE_ENABLED=true.
    if: startsWith(github.ref, 'refs/tags/v') && vars.YONTE_SIGNED_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Yonte release signing key
        env:
          YONTE_KEYSTORE_BASE64: ${{ secrets.YONTE_RELEASE_KEYSTORE_BASE64 }}
          YONTE_STORE_PASSWORD: ${{ secrets.YONTE_RELEASE_STORE_PASSWORD }}
          YONTE_KEY_ALIAS: ${{ secrets.YONTE_RELEASE_KEY_ALIAS }}
          YONTE_KEY_PASSWORD: ${{ secrets.YONTE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$YONTE_KEYSTORE_BASE64"
          printf '%s' "$YONTE_KEYSTORE_BASE64" | base64 --decode > yonte-release.keystore
          cat > yonte-release.properties <<PROPERTIES
          storeFile=yonte-release.keystore
          storePassword=$YONTE_STORE_PASSWORD
          keyAlias=$YONTE_KEY_ALIAS
          keyPassword=$YONTE_KEY_PASSWORD
          PROPERTIES
          chmod 600 yonte-release.keystore yonte-release.properties

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: yonte-signed-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
